name: Daily Dashboard Update

on:
  schedule:
    # Run every day at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run daily check
        run: |
          python scripts/check-pages.py

      - name: Generate report
        run: |
          python scripts/generate-report.py

      - name: Commit updates
        run: |
          git config --local user.email "dashboard@weedistillery.com"
          git config --local user.name "SEO Dashboard Bot"
          git add metrics/
          git diff --staged --quiet || git commit -m "Auto-update metrics: $(date +%Y-%m-%d)"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages